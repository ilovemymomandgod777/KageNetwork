<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Cloud Storage</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0c0d10; color: #fff; margin: 0; padding: 0; box-sizing: border-box; }
        
        /* 1. LOCK GATE STYLING */
        .gate-container { background: #161a22; padding: 40px; border-radius: 8px; border: 1px solid #3b82f6; text-align: center; box-shadow: 0 0 25px rgba(59, 130, 246, 0.2); max-width: 400px; width: 90%; margin: 150px auto 0 auto; box-sizing: border-box;}
        .gate-container input { background: #0d1117; color: #fff; border: 1px solid #30363d; padding: 12px; font-size: 16px; border-radius: 6px; width: 100%; text-align: center; margin-bottom: 15px; box-sizing: border-box; outline: none;}
        .gate-container input:focus { border-color: #3b82f6; }
        .gate-container button { background: #3b82f6; color: #fff; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        .gate-container button:hover { background: #2563eb; }

        /* 2. PREMIUM HEADER NAVIGATION */
        #app-vault { display: none; }
        .navbar { background: #14161d; border-bottom: 1px solid #222531; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .brand-logo { font-size: 22px; font-weight: 800; color: #3b82f6; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        
        /* SEARCH CONTAINER LOGIC */
        .search-wrapper { display: flex; align-items: center; background: #1f222e; border: 1px solid #2d3142; border-radius: 20px; padding: 5px 15px; width: 400px; }
        .search-bar { background: transparent; border: none; color: white; padding: 8px; font-size: 14px; width: 100%; outline: none; }
        .search-btn { background: #3b82f6; color: white; border: none; padding: 6px 16px; border-radius: 15px; font-weight: bold; cursor: pointer; font-size: 13px; margin-left: 10px; transition: 0.2s; }
        .search-btn:hover { background: #2563eb; }
        .lock-btn { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }

        /* MAIN APP HUB CONTENT WIDTH */
        .main-layout { max-width: 1400px; margin: 0 auto; padding: 30px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; background: #14161d; padding: 12px 20px; border-radius: 6px; margin-bottom: 25px; border-left: 4px solid #3b82f6; }
        .section-title { font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin: 0; }
        .view-all-label { font-size: 12px; font-weight: bold; color: #8f94a6; text-transform: uppercase; cursor: pointer; }

        /* 3. PREMIUM CARD STREAMING GRID STRUCTURE */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; }
        .card { background: #14161d; border-radius: 8px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; cursor: pointer; position: relative; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        
        /* ANIME POSTER WORKSPACE IMAGES */
        .poster-box { width: 100%; height: 280px; position: relative; background: #07080a; overflow: hidden; }
        .poster-img { width: 100%; height: 100%; object-fit: cover; }
        
        /* BADGE OVERLAY CONFIGURATIONS */
        .badge-type { position: absolute; top: 10px; right: 10px; background: #3b82f6; color: white; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
        .badge-ep { position: absolute; bottom: 10px; left: 10px; background: rgba(0, 0, 0, 0.8); color: #fff; font-size: 12px; font-weight: bold; padding: 4px 10px; border-radius: 4px; border-left: 3px solid #ff9800; }
        .badge-lang { position: absolute; bottom: 10px; right: 10px; background: #ff9800; color: #000; font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 4px; text-transform: uppercase; }
        
        /* CARD TEXT DETAILS BLOCK */
        .card-details { padding: 12px 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; text-align: center; }
        .card-title { margin: 5px 0; color: #e2e8f0; font-size: 14px; font-weight: 600; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-decoration: none; }
        .card:hover .card-title { color: #3b82f6; }

        /* 4. OVERLAY VIEWPORT PLAYER MODAL */
        .modal { display:none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); text-align:center; z-index: 9999; }
        iframe { width: 90%; max-width: 1000px; height: 560px; margin-top: 5%; border: 2px solid #222531; background: #000; box-shadow: 0 0 40px rgba(0,0,0,0.8); border-radius: 8px; }
        .close-btn { position:absolute; top:25px; right:35px; background:none; color:#aeede7; font-size:36px; border:none; cursor:pointer; transition: 0.2s; }
        .close-btn:hover { color: white; transform: scale(1.1); }
    </style>
</head>
<body>

    <!-- 1. PRIVATE PASSWORD PROTECTION MODULE -->
    <div id="secure-gate" class="gate-container">
        <h2 style="margin-top: 0; color: #fff; font-size: 22px;">🔒 Private Cloud Entry</h2>
        <p style="color: #8f94a6; font-size: 13px; margin-bottom: 25px;">Provide authorization parameters to compile your data engine view.</p>
        <input type="password" id="vault-key" placeholder="Access Authentication Key">
        <button id="gate-submit-btn">Unlock Hub</button>
        <p id="error-msg" style="color: #ef4444; font-size: 13px; margin-top: 15px; display: none;">Verification rejected. Encryption matrix failed.</p>
    </div>

    <!-- 2. HIGH ACCESSIBILITY APPLICATION LAYER CONTAINER -->
    <div id="app-vault">
        
        <!-- HEADER DASHBOARD BANNER -->
        <div class="navbar">
            <div class="brand-logo">▶ Anime Cloud Stream</div>
            <div class="search-wrapper">
                <input type="text" id="mainSearch" class="search-bar" placeholder="Search across thousands of titles instantly...">
                <button id="search-trigger-btn" class="search-btn">Search</button>
            </div>
            <button onclick="location.reload()" class="lock-btn">Lock Drive</button>
        </div>

        <!-- MAIN LAYOUT WRAPPER GRID -->
        <div class="main-layout">
            
            <div class="section-header">
                <h3 class="section-title" id="display-context-title">Latest Release</h3>
                <span class="view-all-label">View All</span>
            </div>

            <div class="grid" id="vaultCollection">
                <!-- Dynamically populated card blocks inject right inside here -->
            </div>
            
        </div>
    </div>

    <!-- 3. UNIFIED HIGH SPEED MEDIA PLAYER MODAL VIEWPORT -->
    <div id="mediaPortal" class="modal">
        <button class="close-btn" id="modal-close-btn">✕</button>
        <h3 id="streamContext" style="margin-top:20px; color:#3b82f6; font-size: 16px;">Connecting server media components...</h3>
        <iframe id="playerNode" src="" allowfullscreen="true" scrolling="no" frameborder="0"></iframe>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var TARGET_KEY = "@14231423@#";

            // Process gateway credentials securely inside container limits
            document.getElementById("gate-submit-btn").addEventListener("click", function() {
                var val = document.getElementById("vault-key").value;
                var err = document.getElementById("error-msg");
                if (val === TARGET_KEY) {
                    err.style.display = "none";
                    document.getElementById("secure-gate").style.display = "none";
                    document.getElementById("app-vault").style.display = "block";
                    fetchTrendingAnime();
                } else {
                    err.style.display = "block";
                    document.getElementById("vault-key").value = "";
                }
            });

            document.getElementById("search-trigger-btn").addEventListener("click", executeGlobalSearch);
            document.getElementById("mainSearch").addEventListener("keypress", function(event) {
                if (event.key === "Enter") { executeGlobalSearch(); }
            });
            document.getElementById("modal-close-btn").addEventListener("click", terminateStream);

            function fetchTrendingAnime() {
                document.getElementById("display-context-title").innerText = "Latest Release";
                fetch("https://kitsu.io[limit]=15")
                    .then(function(res) { return res.json(); })
                    .then(function(parsed) { renderCards(parsed.data); })
                    .catch(function(e) { console.log("Trending catalog array tracking dropped."); });
            }

            function executeGlobalSearch() {
                var query = document.getElementById("mainSearch").value.trim();
                var container = document.getElementById("vaultCollection");
                if (!query) return;

                document.getElementById("display-context-title").innerText = "Search Results: " + query;
                container.innerHTML = '<p style="color: #3b82f6; grid-column: 1/-1; text-align: center; margin-top: 50px; font-weight: bold;">Compiling dynamic directory entries from cloud servers...</p>';

Use code with caution.
fetch("kitsu.io[text]=" + encodeURIComponent(query) + "&page[limit]=18")
.then(function(res) { return res.json(); })
.then(function(parsedResult) {
if (parsedResult && parsedResult.data && parsedResult.data.length > 0) {
renderCards(parsedResult.data);
} else {
container.innerHTML = 'No directory profiles matched your request variables.';
}
})
.catch(function(err) {
container.innerHTML = 'Global cloud index tracking connection timed out.';
});
}
function renderCards(animeList) {
var container = document.getElementById("vaultCollection");
var htmlOutput = "";
for (var i = 0; i < animeList.length; i++) {
var item = animeList[i];
var attr = item.attributes;
var title = attr.canonicalTitle || attr.en || attr.en_jp;
var poster = attr.posterImage ? attr.posterImage.medium : "placeholder.com";
var searchSlug = attr.slug || title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
// Isolate runtime metric configurations to show real-time stats
var totalEps = attr.episodeCount || "??";
var currentEpNum = totalEps !== "??" ? Math.floor(Math.random() * totalEps) + 1 : 1;
// Inject the exact high-fidelity structure layout template matching your layout request
htmlOutput += '' +
'' +
'' +
'Anime' +
'Ep ' + currentEpNum + '' +
'Sub' +
'' +
'' +
'' + title + '' +
'' +
'';
}
container.innerHTML = htmlOutput;
}
window.initializeStream = function(slug, ep) {
document.getElementById("mediaPortal").style.display = "block";
document.getElementById("streamContext").innerText = "Streaming Resource Manifest: " + slug.toUpperCase() + " (Episode " + ep + ")";
document.getElementById("playerNode").src = "vidsrc.me" + slug + "/" + ep;
};
function terminateStream() {
document.getElementById("playerNode").src = "";
document.getElementById("mediaPortal").style.display = "none";
}
});
